name: test

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # golang.design/x/clipboard builds against X11 on Linux, headers
      # are only needed for compilation, tests never touch a display
      - name: Install X11 headers
        run: sudo apt-get update && sudo apt-get install -y libx11-dev

      - name: test
        run: go test -v ./...
