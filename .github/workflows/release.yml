name: Publish Go Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release
        # all builds are CGO-free (shirei purego backends, golang.design/x/clipboard
        # v0.9), so plain goreleaser cross compiles every target from linux
        uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Homebrew formula
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          scripts/brew-bump.sh "${GITHUB_REF#refs/tags/}"
