name: Publish Go Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release
        # goreleaser-cross bundles osxcross so cgo targets (ovrui on macOS)
        # can be cross compiled from linux; libx11-dev is required to build
        # the clipboard cgo dependency for ovrui
        run: |
          docker run --rm --privileged \
            -v "$PWD":/go/src/ovr \
            -w /go/src/ovr \
            -e GITHUB_TOKEN \
            --entrypoint bash \
            ghcr.io/goreleaser/goreleaser-cross:v1.27.0 \
            -c "git config --global --add safe.directory /go/src/ovr && apt-get update -qq && apt-get install -y -qq libx11-dev && goreleaser release --clean"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Homebrew formula
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          scripts/brew-bump.sh "${GITHUB_REF#refs/tags/}"
