<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ovr — pipe anything through transformations</title>
  <meta name="description" content="ovr applies a chain of transformations to text, JSON, CSV, time and geometry. This is the browser (wasm) build of the ovrui frontend." />
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      background: #14161a;
      color: #e6e8eb;
    }
    header#top {
      flex: 0 0 auto;
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 10px 16px;
      font: 13px/1.4 system-ui, -apple-system, sans-serif;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    header#top .brand { font-weight: 700; letter-spacing: 0.06em; }
    header#top .tag { color: #9aa4af; }
    header#top .spacer { flex: 1; }
    header#top a { color: #7fb4ff; text-decoration: none; }
    header#top a:hover { text-decoration: underline; }
    #shirei-root {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
      background: #fff;
    }
    #shirei-canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      touch-action: none;
    }
    #shirei-status {
      position: fixed;
      left: 12px;
      bottom: 12px;
      font: 12px/1.4 system-ui, sans-serif;
      color: #888;
      pointer-events: none;
    }
    @media (max-width: 600px) { header#top .tag { display: none; } }
  </style>
</head>
<body>
  <header id="top">
    <span class="brand">ovr</span>
    <span class="tag">pipe anything through a chain of transformations — runs entirely in your browser</span>
    <span class="spacer"></span>
    <a href="https://github.com/akhenakh/ovr" target="_blank" rel="noopener noreferrer">GitHub</a>
  </header>
  <div id="shirei-root">
    <canvas id="shirei-canvas" tabindex="0"></canvas>
  </div>
  <div id="shirei-status">Loading…</div>
  <script src="wasm_exec.js"></script>
  <script>
    (async () => {
      const status = document.getElementById("shirei-status");
      try {
        const go = new Go();
        if (!WebAssembly.instantiateStreaming) {
          WebAssembly.instantiateStreaming = async (resp, importObject) => {
            const source = await (await resp).arrayBuffer();
            return await WebAssembly.instantiate(source, importObject);
          };
        }
        const result = await WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject);
        status.textContent = "";
        go.run(result.instance);
      } catch (err) {
        console.error(err);
        status.textContent = "Failed to start: " + err;
      }
    })();
  </script>
</body>
</html>
