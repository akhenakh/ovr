version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: ovr
    main: ./cmd/ovr
    binary: ovr
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

  # ovrui's macOS backend (shirei cocoabackend) requires cgo, cross compiled
  # with the osxcross toolchain from goreleaser-cross (see release.yml).
  # linux builds are CGO-free; clipboard reports unavailable at runtime.
  - id: ovrui
    main: ./cmd/ovrui
    binary: ovrui
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      # osxcross from goreleaser-cross only supports darwin/arm64
      - goos: darwin
        goarch: amd64
    overrides:
      - goos: darwin
        goarch: arm64
        env:
          - CGO_ENABLED=1
          - CC=oa64-clang
          - CXX=oa64-clang++
          # Go's darwin/arm64 objects target macOS 13; without this the
          # linker defaults to 11.0 and fails with undefined
          # ___isPlatformVersionAtLeast
          - MACOSX_DEPLOYMENT_TARGET=13.0

archives:
  # separate archives per build: goreleaser requires the same binary count
  # in each archive and ovrui is not available on every ovr platform
  - id: ovr
    builds:
      - ovr
    formats: ['tar.gz']
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

  - id: ovrui
    builds:
      - ovrui
    formats: ['tar.gz']
    name_template: >-
      ovrui_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
