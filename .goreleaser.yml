version: 2

before:
  hooks:
    - go mod tidy

builds:
  # everything is CGO-free: shirei's desktop backends use purego, and
  # golang.design/x/clipboard v0.9 is cgo-free on all desktop platforms,
  # so both binaries cross compile from linux without an SDK
  - id: ovr
    main: ./cmd/ovr
    binary: ovr
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

  - id: ovrui
    main: ./cmd/ovrui
    binary: ovrui
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  # separate archives per build: goreleaser requires the same binary count
  # in each archive and ovrui is not available on every ovr platform
  - id: ovr
    builds:
      - ovr
    formats: ['tar.gz']
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

  - id: ovrui
    builds:
      - ovrui
    formats: ['tar.gz']
    name_template: >-
      ovrui_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
