version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: ovr
    main: ./cmd/ovr
    binary: ovr
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

  # ovrui's macOS backend (shirei cocoabackend) requires cgo, cross compiled
  # with the osxcross toolchain from goreleaser-cross (see release.yml)
  - id: ovrui
    main: ./cmd/ovrui
    binary: ovrui
    env:
      - CGO_ENABLED=1
    flags:
      - -trimpath
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      # osxcross from goreleaser-cross only supports darwin/arm64
      - goos: darwin
        goarch: amd64
    overrides:
      - goos: linux
        goarch: arm64
        env:
          - CC=aarch64-linux-gnu-gcc
          - CXX=aarch64-linux-gnu-g++
      - goos: darwin
        goarch: arm64
        env:
          - CC=oa64-clang
          - CXX=oa64-clang++

archives:
  - id: default
    ids:
      - ovr
      - ovrui
    formats: ['tar.gz']
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
